[project]
name = "yt-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.12",
    "edge-tts>=7.2.8",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "google-genai>=2.14.0",
    "kokoro>=0.9.4",
    "langchain>=1.3.14",
    "langchain-openrouter>=0.2.7",
    "mutagen>=1.48.1",
    "numpy>=2.0.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "tavily-python>=0.7.26",
    "tornado>=6.5.7",
    "imageio-ffmpeg>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

